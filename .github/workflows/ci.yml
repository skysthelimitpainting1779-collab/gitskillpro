name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: node dist/cli/index.js --help
      - run: node dist/cli/index.js doctor --json
      - run: node dist/cli/index.js inspect --json
      - run: node dist/cli/index.js detect providers --json
      - run: node dist/cli/index.js audit git --json
      - run: node dist/cli/index.js audit beads --json
      - run: node dist/cli/index.js audit ci tests/fixtures/providers/ci.json --json
      - run: node dist/cli/index.js audit pr tests/fixtures/providers/pr.json --json
      - run: node dist/cli/index.js audit deploy tests/fixtures/providers/deploy.json --json
      - run: node dist/cli/index.js audit db tests/fixtures/providers/db.json --json
      - run: node dist/cli/index.js automation discover --json
      - run: node dist/cli/index.js automation audit tests/fixtures/automation/audit.json --json
      - run: node dist/cli/index.js automation plan tests/fixtures/automation/plan.json --json
      - run: node dist/cli/index.js automation detect-loops tests/fixtures/automation/loops.json --json
      - run: node dist/cli/index.js automation verify-idempotency tests/fixtures/automation/idempotency.json --json
      - run: node dist/cli/index.js bootstrap plan --json
      - run: node dist/cli/index.js delegate plan ENG-42 "Add work graph" --json
      - run: node dist/cli/index.js recover project tests/fixtures/recovery/messy-project.json --json
      - run: node dist/cli/index.js recover ci tests/fixtures/recovery/messy-project.json --json
      - run: node dist/cli/index.js context plan tests/fixtures/context/plan.json --json
      - run: node dist/cli/index.js context checkpoint tests/fixtures/context/checkpoint.json --json
      - run: node dist/cli/index.js docs plan tests/fixtures/context/docs.json --json
      - run: node dist/cli/index.js cost report tests/fixtures/context/cost.json --json
      - name: Prove verification left tracked state unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

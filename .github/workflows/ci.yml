name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Commit generated lockfile on build branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/build/gitskillpro'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "build: add deterministic npm lockfile"
            git push origin HEAD:build/gitskillpro
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli/index.js --help
